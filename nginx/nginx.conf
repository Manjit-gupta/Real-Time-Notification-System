upstream app_cluster {
    # Docker Compose internal DNS resolves "app" to all scaled containers.
    # nginx round-robins HTTP requests across every instance automatically.
    # ip_hash keeps each client on the same instance for the WebSocket lifetime.
    ip_hash;
    server app:3000;
}

server {
    listen 80;

    # Tune for high-concurrency load tests
    keepalive_requests 10000;
    keepalive_timeout  75s;

    location / {
        proxy_pass         http://app_cluster;
        proxy_http_version 1.1;

        # Required for WebSocket upgrade
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
